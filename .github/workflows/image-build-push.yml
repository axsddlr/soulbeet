name: Build and Push Docker Image

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git reference to checkout"
        required: false
        type: string
      tags:
        description: "Extra tags"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/axsddlr/soulbeet

# GITHUB_TOKEN publishes to GitHub Container Registry; no registry secrets.
permissions:
  contents: read
  packages: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      rolling: ${{ steps.rolling.outputs.rolling }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          # Light is the default image: it takes the bare tags (latest, 1.0.0).
          # Medium and full get the same tags with a -medium / -full suffix,
          # added by the merge job. Nothing else is published.
          tags: |
            ${{ inputs.tags }}
            type=semver,pattern={{version}}
            type=ref,event=branch,enable={{is_not_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Only master and release tags move :latest; the size check compares
      # against it. Feature branches and prerelease tags (v1.2.3-rc.1)
      # publish their own tags only.
      - name: Decide whether this ref moves the latest tags
        id: rolling
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/heads/master) rolling=true ;;
            refs/tags/v*-*) rolling=false ;;
            refs/tags/v*) rolling=true ;;
            *) rolling=false ;;
          esac
          echo "rolling=$rolling" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        # platform must be a real axis: include entries with only non-axis
        # keys do not fan out, they merge into every tier job in order and
        # the last one wins (this previously built all tiers as arm64 only).
        tier: [light, medium, full]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # Pushed by digest, without a tag: the merge job names the multi-arch
      # images, so no per-arch tags show up in the registry.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          labels: ${{ needs.metadata.outputs.labels }}
          build-args: |
            TIER=${{ matrix.tier }}
          cache-from: |
            type=gha,scope=${{ github.workflow }}-${{ matrix.platform }}-${{ matrix.tier }}
            type=gha,scope=${{ github.workflow }}-${{ matrix.platform }}-rust
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-${{ matrix.platform }}-${{ matrix.tier }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.tier }}-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      # Per-tier smoke test. Only runs on amd64 (where ubuntu-latest can
      # natively execute the built binary) and only when the build was
      # actually pushed (PR builds skip push, so there is nothing to pull).
      # arm64 correctness is trusted to the multi-arch build itself plus
      # the merge job's manifest validation.
      - name: Smoke test built image (amd64 only, push events only)
        if: matrix.suffix == 'amd64' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -e
          IMG="${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          docker pull "$IMG"
          # beets itself must run on every tier. Soulful's runtime health check
          # shells out to `beet --version`; that triggers beets' full command
          # import chain (autotag.match -> import lap), so a numpy/lap C-ABI
          # mismatch aborts it and the app reports "Missing Beets" (issue #66).
          # Run the exact health-check command here so a broken venv fails the
          # build instead of being published. The beet shebang is patched to
          # /usr/bin/python3, which is why it runs under the distroless runtime.
          docker run --rm --entrypoint=/opt/venv/bin/beet "$IMG" --version
          # The shipped config must probe clean. This is the same probe,
          # interpreter (-P keeps PYTHONPATH) and cwd (/app) the server uses.
          # It replaces a grep for "error loading plugin" (issue #82).
          script=$(cat "$GITHUB_WORKSPACE/lib/soulbeet/src/beets/probe.py")
          [ -n "$script" ] || { echo "FAIL: probe.py is empty or missing"; exit 1; }
          probe=$(docker run --rm --entrypoint=/usr/bin/python3 "$IMG" \
            -P -c "$script" /app/beets_config.yaml)
          echo "$probe"
          jq -e '.fatal == null and (.plugin_errors | length) == 0 and .import_hook
                 and ([.metadata_sources[] | select(. != "Acoustid")] | length) > 0' \
            <<<"$probe" >/dev/null \
            || { echo "FAIL: shipped beets config does not probe clean"; exit 1; }
          docker run --rm --entrypoint=/tini "$IMG" --version
          # /opt/venv/bin/python3 is a dangling symlink in the distroless
          # runtime (the builder's interpreter path does not exist there);
          # the real interpreter is /usr/bin/python3, which finds the venv
          # packages via the PYTHONPATH baked into the image. Same reason
          # the Dockerfile patches the beet shebang.
          py() { docker run --rm --entrypoint=/usr/bin/python3 "$IMG" "$@"; }
          case "${{ matrix.tier }}" in
            light)
              # Light must NOT have chroma deps in /opt/venv. The import is
              # EXPECTED to fail, so capture output instead of piping the
              # nonzero docker run into grep (pipefail would flag it).
              out=$(py -c "import acoustid" 2>&1 || true)
              grep -q ModuleNotFoundError <<<"$out" \
                || { echo "FAIL: light tier should not have acoustid"; exit 1; }
              echo "light tier smoke OK"
              ;;
            medium)
              # Medium must have fpcalc on PATH and pyacoustid in /opt/venv.
              docker run --rm --entrypoint=/usr/bin/fpcalc "$IMG" -version
              py -c "import acoustid"
              echo "medium tier smoke OK"
              ;;
            full)
              # Full must have ffmpeg, Pillow, the replaygain plugin module,
              # and must NOT have PyGObject (Pitfall 2 mitigation).
              # Capture ffmpeg -version: piping it straight into head -1
              # kills ffmpeg with SIGPIPE, which pipefail turns into failure.
              ffv=$(docker run --rm --entrypoint=/usr/local/bin/ffmpeg "$IMG" -version)
              head -1 <<<"$ffv"
              py -c "from PIL import Image"
              py -c "import beetsplug.replaygain"
              out=$(py -c "import gi" 2>&1 || true)
              grep -q ModuleNotFoundError <<<"$out" \
                || { echo "FAIL: full tier should not have PyGObject"; exit 1; }
              echo "full tier smoke OK"
              ;;
          esac


  merge:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Sum of the compressed layer sizes of the amd64 image behind a tag; 0
      # when the tag does not exist yet.
      - name: Record the size of the current :latest
        id: old-size
        if: needs.metadata.outputs.rolling == 'true'
        shell: bash
        run: |
          size=$(docker buildx imagetools inspect --raw "${{ env.IMAGE_NAME }}:latest" 2>/dev/null             | jq -r '.manifests[]? | select(.platform.architecture == "amd64") | .digest'             | head -1             | xargs -r -I{} docker buildx imagetools inspect --raw "${{ env.IMAGE_NAME }}@{}"             | jq '[.layers[].size] | add // 0' || true)
          echo "bytes=${size:-0}" >> "$GITHUB_OUTPUT"

      - name: Create and push multi-arch manifests
        shell: bash
        run: |
          set -e
          # One multi-arch image per tier, under every base tag. Light takes
          # the bare tag (:latest, :1.0.0); medium and full add a suffix.
          mapfile -t TAGS <<<"${{ needs.metadata.outputs.tags }}"
          for TIER in light medium full; do
            args=()
            for tag in "${TAGS[@]}"; do
              [[ -z "$tag" ]] && continue
              if [[ "$TIER" == light ]]; then
                args+=(-t "$tag")
              else
                args+=(-t "${tag}-${TIER}")
              fi
            done
            sources=()
            for f in /tmp/digests/digests-"$TIER"-*/*; do
              sources+=("${{ env.IMAGE_NAME }}@sha256:$(basename "$f")")
            done
            [[ ${#sources[@]} -eq 2 ]] || { echo "FAIL: expected 2 digests for $TIER, got ${#sources[@]}"; exit 1; }
            docker buildx imagetools create "${args[@]}" "${sources[@]}"
          done

      # NFR-16-01 size guard: warn (but do not block, per D-CI-03) if the new
      # :latest grew by more than 5 MB over the one it replaced.
      - name: Compare the size of the new :latest
        if: needs.metadata.outputs.rolling == 'true'
        shell: bash
        run: |
          OLD_SIZE=${{ steps.old-size.outputs.bytes }}
          NEW_SIZE=$(docker buildx imagetools inspect --raw "${{ env.IMAGE_NAME }}:latest"             | jq -r '.manifests[] | select(.platform.architecture == "amd64") | .digest'             | head -1             | xargs -I{} docker buildx imagetools inspect --raw "${{ env.IMAGE_NAME }}@{}"             | jq '[.layers[].size] | add // 0')
          echo "Light compressed size (amd64): $((NEW_SIZE / 1024 / 1024)) MiB (previous :latest: $((OLD_SIZE / 1024 / 1024)) MiB)"
          if [ "$OLD_SIZE" -gt 0 ]; then
            DELTA_MB=$(( (NEW_SIZE - OLD_SIZE) / 1024 / 1024 ))
            echo "Delta: ${DELTA_MB} MiB"
            if [ "$DELTA_MB" -gt 5 ]; then
              echo "::warning::Light image compressed size grew by ${DELTA_MB} MB vs the previous :latest (NFR-16-01 budget: 5 MB)"
            fi
          else
            echo "::notice::No previous :latest; skipping the size comparison"
          fi
